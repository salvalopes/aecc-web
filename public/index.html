<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Safari: "Add to Home Screen" support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AECC" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Colors the Safari status bar / bottom toolbar chrome. Two variants
         (instead of app.config.ts web.themeColor, which only allows one
         static value) so each matches surfaceApp from src/theme/colors.ts
         for the OS color scheme actually in effect — otherwise Safari falls
         back to white for whichever scheme isn't covered. -->
    <meta name="theme-color" content="#fdf9f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1a24" media="(prefers-color-scheme: dark)" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Tracks Safari's dynamic viewport (address bar collapsing/expanding)
           instead of a stale height computed before it collapses. */
        height: 100dvh;
      }
      /* --aecc-surface-app / --aecc-focus-ring mirror colors.ts's surfaceApp /
         focusRing. The values below are only the pre-hydration/no-JS guess,
         keyed off the OS scheme; ThemeContext overwrites both custom
         properties on <html> the instant it mounts, so once React is running
         these track the app's own light/dark toggle (which the user can set
         independently of the OS scheme) rather than prefers-color-scheme.
         html/body/#root read the var so the safe-area / overscroll regions
         under the Safari status bar and bottom toolbar (and the
         pre-hydration paint) are never the browser's default white. */
      :root {
        --aecc-surface-app: #fdf9f0;
        --aecc-focus-ring: #7f580c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --aecc-surface-app: #0b1a24;
          --aecc-focus-ring: #f2c85a;
        }
      }
      html,
      body,
      #root {
        background-color: var(--aecc-surface-app);
      }
      /* Focus ring for the Início search field only (id set in
         app/(app)/index.tsx) — keyboard focus only (:focus-visible), never
         on tap/click, and touches no other element on the page. */
      #aecc-search-input:focus {
        outline: none;
      }
      #aecc-search-input:focus-visible {
        outline: 2px solid var(--aecc-focus-ring);
        outline-offset: 2px;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* Stop rubber-band/bounce scrolling from ever gaining a horizontal
         component and reaching the document edge — that's what makes iOS
         Safari mistake a vertical scroll for its edge-swipe-back gesture and
         flash the back arrow. This is global (html/body), not per-screen:
         with `web.output: 'single'` (app.config.ts), this file is the only
         HTML shell Expo ever serves — there is no app/+html.tsx involved. */
      html,
      body {
        overflow-x: hidden;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            // PWA install/offline caching is a progressive enhancement — ignore failures.
          });
        });
      }
    </script>
  </body>
</html>
