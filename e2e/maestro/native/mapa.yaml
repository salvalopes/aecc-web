# Smoke do mapa (mapa-plano W8 + refinamento Fase B): tab Mapa → contagem do seed, legenda,
# atribuição (OSM à entrada, "Posições © EU GISCO" sempre), chips com contagem, deep link
# ?company= → ficha (só ficha, GISCO e "(i)"), "voltar" do Android fecha a ficha → detalhe, e
# capturas claro/escuro.
# Pré-requisitos: dev build com o MapLibre e Metro com EXPO_PUBLIC_TILES_URL a apontar para a
# fixture local (ver run.sh); seed E2E com 5 empresas no mapa (c006 escondida).
appId: com.aecc.app
name: mapa (nativo)
---
- runFlow: _login.yaml
- tapOn: "Mapa"
- extendedWaitUntil:
    visible:
      id: "map.view"
    timeout: 30000
- assertVisible:
    id: "map.attribution"
- assertVisible:
    id: "map.attribution.gisco"
- assertVisible: "Posições © EU GISCO"
- assertVisible: "5 empresas"
- assertVisible:
    id: "map.locate"

# Faixa de baixo (direção B): a legenda está no painel do "(i)" ("Legenda e fontes").
# A OSM pode já ter recolhido sozinha (5 s; o Maestro no iOS é lento a ler a hierarquia).
- tapOn:
    id: "map.attribution.close"
    optional: true
- tapOn:
    id: "map.attribution.info"
- extendedWaitUntil:
    visible:
      id: "map.legend"
    timeout: 10000
- assertVisible: "Legenda e fontes"
- assertVisible: "Zona aproximada \\(código postal\\)"
- tapOn:
    id: "map.attribution.details.close"
- assertNotVisible:
    id: "map.legend"

# Filtro por categoria (os chips do diretório).
- tapOn:
    id: "companies.category-chip-e2e-restauracao"
- extendedWaitUntil:
    visible: "2 empresas"
    timeout: 15000
- tapOn:
    id: "companies.category-chip-all"
- extendedWaitUntil:
    visible: "5 empresas"
    timeout: 15000

# Deep link: foca a empresa e abre a ficha (ENI em zona → nota de zona aproximada).
- runFlow:
    file: _open-link.yaml
    env:
      LINK: "aecc://map?company=e2e00000-0000-0000-0000-00000000c001"
- extendedWaitUntil:
    visible:
      id: "map.card"
    timeout: 20000
- assertVisible: "Pastelaria Conceição"
- assertVisible: "Zona aproximada.*"
# Com a ficha aberta: a OSM recolhe para o "(i)"; o GISCO curto fica (a legenda só no painel).
- assertNotVisible:
    id: "map.legend"
- assertVisible:
    id: "map.attribution.info"
- assertVisible:
    id: "map.attribution.gisco"
- waitForAnimationToEnd
- takeScreenshot: mapa-claro
# Android: o "voltar" fecha a ficha (e fica no mapa); volta-se a abri-la pelo deep link.
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
      - extendedWaitUntil:
          notVisible:
            id: "map.card"
          timeout: 10000
      - assertVisible:
          id: "map.view"
      - runFlow:
          file: _open-link.yaml
          env:
            LINK: "aecc://map?company=e2e00000-0000-0000-0000-00000000c001"
      - extendedWaitUntil:
          visible:
            id: "map.card"
          timeout: 20000
- tapOn:
    id: "map.card.open"
- extendedWaitUntil:
    visible:
      id: "company-detail.screen"
    timeout: 20000

# Tema escuro (o estilo do mapa troca sem recarregar os tiles).
- tapOn: "Perfil"
- extendedWaitUntil:
    visible:
      id: "profile.theme"
    timeout: 15000
- tapOn:
    id: "profile.theme-dark"
- tapOn: "Mapa"
- extendedWaitUntil:
    visible:
      id: "map.view"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: mapa-escuro
- tapOn: "Perfil"
- tapOn:
    id: "profile.theme-system"
