# Subfluxo: o iOS oferece "Guardar palavra-passe?" (Passwords) depois de um login com
# textContentType password. Recusar se aparecer; no Android não aparece.
appId: com.aecc.app
---
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Agora não|Not Now"
          timeout: 10000
          optional: true
      - tapOn:
          text: "Agora não|Not Now"
          optional: true
