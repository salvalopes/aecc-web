# O Admin continua a chegar à tab Utilizadores por deep link (a guarda de `aecc://users`
# redireciona-o). Contraponto do fluxo sem-permissao-users.
appId: com.aecc.app
name: deeplink-users-admin (nativo)
---
- runFlow: _login.yaml
- runFlow:
    file: _open-link.yaml
    env:
      LINK: "aecc://users"
- extendedWaitUntil:
    visible:
      id: "users.screen"
    timeout: 15000
