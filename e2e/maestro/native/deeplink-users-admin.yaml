# O Admin chega aos Utilizadores por deep link: desde a W1 do mapa já não é uma tab, mas a rota
# do Stack /users (Gestão → Utilizadores). Contraponto do fluxo sem-permissao-users.
appId: com.aecc.app
name: deeplink-users-admin (nativo)
---
- runFlow: _login.yaml
- runFlow:
    file: _open-link.yaml
    env:
      LINK: "aecc://users"
- extendedWaitUntil:
    visible:
      id: "users.screen"
    timeout: 15000
