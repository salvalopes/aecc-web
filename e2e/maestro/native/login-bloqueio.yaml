# Lockout (T1): a conta descartável criada pelo run.sh já foi bloqueada (5 tentativas falhadas
# pela API). Entrar com a palavra-passe certa mostra a mensagem de bloqueio. NUNCA usa a conta do seed.
appId: com.aecc.app
name: login-bloqueio (nativo)
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login.screen"
    timeout: 120000
- tapOn:
    id: "login.email"
- inputText:
    text: ${THROWAWAY_EMAIL}
    label: "Escrever o email descartável"
- tapOn:
    id: "login.password"
- inputText:
    text: ${THROWAWAY_PASSWORD}
    label: "Escrever a palavra-passe descartável"
- pressKey: Enter
- runFlow: _dismiss-save-password.yaml
- extendedWaitUntil:
    visible:
      id: "login.form-error"
    timeout: 15000
- assertVisible: ".*bloqueada.*"
- waitForAnimationToEnd
- takeScreenshot: login-bloqueio
