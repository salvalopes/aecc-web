# Teclado nos formulários de auth (T1): no confirm-email (4 campos), com o teclado aberto no
# último campo o botão de submeter tem de ficar alcançável com scroll. Se o ecrã não deixa
# espaço para o teclado (Android edge-to-edge), o fim do conteúdo fica atrás dele e o botão
# nunca aparece.
# O link é inválido de propósito: só interessa chegar ao botão, não confirmar nada.
appId: com.aecc.app
name: teclado-auth (nativo)
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login.screen"
    timeout: 120000
- openLink: "aecc://confirm-email?userId=00000000-0000-0000-0000-000000000000&token=invalido"
- extendedWaitUntil:
    visible:
      id: "confirm-email.confirm-password"
    timeout: 15000
- tapOn:
    id: "confirm-email.confirm-password"
- waitForAnimationToEnd
- takeScreenshot: teclado-auth
- scrollUntilVisible:
    element:
      id: "confirm-email.submit"
- tapOn:
    id: "confirm-email.submit"
