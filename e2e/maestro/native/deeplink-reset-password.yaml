# Deep link de reset-password: Android por App Link (https://aecc.salv4.com/…), iOS pelo
# esquema aecc://. O run.sh pede o reset do cliente@e2e.test à API E2E, lê o link do log
# do ConsoleEmailSender e passa-o em RESET_LINK (nunca escrito aqui). A nova password é a
# mesma do seed, para não mudar o estado dos outros fluxos.
# No nativo, o fim do reset leva ao login com um aviso de sucesso; o login seguinte prova-o.
appId: com.aecc.app
name: deeplink-reset-password (nativo)
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login.screen"
    timeout: 120000
- openLink:
    link: ${RESET_LINK}
    label: "Abrir o link de reset-password"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Abrir|Open"
          optional: true
- extendedWaitUntil:
    visible:
      id: "reset-password.new-password"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: reset-password
- tapOn:
    id: "reset-password.new-password"
- inputText:
    text: ${PASSWORD}
    label: "Escrever a nova palavra-passe"
- tapOn:
    id: "reset-password.confirm-password"
- inputText:
    text: ${PASSWORD}
    label: "Confirmar a nova palavra-passe"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "login.notice"
    timeout: 20000
- assertVisible:
    id: "login.screen"
- waitForAnimationToEnd
- takeScreenshot: reset-password-login

- tapOn:
    id: "login.email"
- inputText:
    text: ${EMAIL}
    label: "Escrever o email"
- tapOn:
    id: "login.password"
- inputText:
    text: ${PASSWORD}
    label: "Escrever a palavra-passe"
- pressKey: Enter
- runFlow: _dismiss-save-password.yaml
- extendedWaitUntil:
    visible:
      id: "companies.screen"
    timeout: 30000
