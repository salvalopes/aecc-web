# Sem permissão (T2): quem não é Admin abre aecc://users (rota do Stack, Gestão → Utilizadores
# desde a W1 do mapa) e vê o estado "sem permissão" do próprio ecrã.
appId: com.aecc.app
name: sem-permissao-users (nativo)
---
- runFlow: _login.yaml
- runFlow:
    file: _open-link.yaml
    env:
      LINK: "aecc://users"
- extendedWaitUntil:
    visible:
      id: "state.forbidden"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: sem-permissao-users
- tapOn:
    id: "state.forbidden.action"
- extendedWaitUntil:
    visible:
      id: "home.screen"
    timeout: 15000
