# Spike Fase 0B-2a — Maestro web: login/logout do associado contra a stack E2E local.
# Pré-requisitos: stack E2E do aecc-api (http://localhost:5080) com seed-e2e corrido e
#   EXPO_PUBLIC_API_URL=http://localhost:5080/api npx expo start --web --port 8081
# Correr (a password nunca fica escrita aqui nem na linha de comandos):
#   set -a; source ../aecc-api/.env.e2e; set +a
#   maestro test --headless -e E2E_PASSWORD="$E2E_SEED_PASSWORD" e2e/maestro/web/login-logout.yaml
url: http://localhost:8081
name: login-logout (web)
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "login.screen"
    timeout: 30000
- tapOn:
    id: "login.email"
- inputText: "associado@e2e.test"
- tapOn:
    id: "login.password"
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: "login.submit"
# Login sai da app (POST /auth/login → /api/connect/authorize → /auth/callback),
# que acaba em /(app)/companies (app/auth/callback.tsx) — o ecrã inicial após login.
- extendedWaitUntil:
    visible:
      id: "companies.screen"
    timeout: 30000
- tapOn:
    id: "topbar.profile"
- tapOn:
    id: "profile.logout"
- extendedWaitUntil:
    visible:
      id: "login.screen"
    timeout: 15000
- assertNotVisible:
    id: "topbar.profile"
