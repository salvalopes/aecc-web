# CI + deploy do aecc-web.
#
#   e2e    → lint + tsc + Playwright (5 fluxos) contra uma stack E2E levantada no runner.
#            Corre em PRs para main, em push para main e manualmente (workflow_dispatch).
#   deploy → expo export + rsync para o servidor. Só em push para main e só se o e2e passar.
#
# IMAGEM DA API: o gate corre contra uma imagem do aecc-api FIXADA POR DIGEST
# (env AECC_API_IMAGE do job e2e, abaixo), não contra `:latest`. Assim um deploy da API
# não parte este gate sem nenhuma alteração no web. Procedimento de atualização:
# docs/CI.md. A stack (Postgres + API + seed-e2e) vive em scripts/ci/e2e-api.sh, que o
# aecc-api também usa nos PRs dele.
# Acesso: o repo aecc-web tem permissão de leitura ao pacote no GHCR; o login usa o
# GITHUB_TOKEN (permissions: packages: read), sem PATs.

name: Deploy aecc-web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Em PRs, um novo push cancela o run anterior; em main nunca se cancela um deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      # Imagem da API usada pelo gate. Fonte ÚNICA deste valor.
      # Atualizar só DEPOIS de o deploy da API ter corrido. Procedimento e comandos
      # (log do deploy do aecc-api + contentor em produção) em docs/CI.md.
      # Atual: aecc-api@ccd928a (#10), deploy de 2026-11-18, o mesmo digest que está em produção.
      AECC_API_IMAGE: ghcr.io/salvalopes/aecc-api@sha256:e0a481681043b26e7f0b3778a08d70c42e79594e64f28d431af5b07e24ca12be
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Login no GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar password do seed (aleatória, mascarada)
        run: |
          # Maiúscula + minúscula + dígito, ≥ 8 caracteres (política do Identity).
          pw="$(openssl rand -hex 16)Aa1"
          echo "::add-mask::$pw"
          echo "E2E_SEED_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Levantar a stack E2E (Postgres + API + seed-e2e)
        run: scripts/ci/e2e-api.sh up

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - name: Upload artefactos do Playwright (traces, vídeos, relatório)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: e2e/web/.artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Logs da API
        if: always()
        run: scripts/ci/e2e-api.sh logs

  deploy:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Export web estático
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://aecc.salv4.com/api

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Garantir rsync no servidor
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "command -v rsync >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y rsync)"

      - name: Rsync dist para o servidor
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/deploy/aecc/web/
